name: Prepare DCG Entertainment Transparent Logo
on:
  push:
    branches: [fix-ceo-ecosystem-layout-20261015]
    paths:
      - tools/prepare_entertainment_logo.py
      - .github/workflows/derive-entertainment-logo.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Preserve artwork and clear only edge-connected white background
        run: python tools/prepare_entertainment_logo.py
      - name: Commit derived asset (never overwrite source logo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/dcg-entertainment-emblem-transparent-preserved.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: preserve full Entertainment emblem with transparent background"
          git push origin HEAD:fix-ceo-ecosystem-layout-20261015
