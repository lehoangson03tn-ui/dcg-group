name: DCG Editorial Visual QA
on:
  push:
    branches: [editorial-founder-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser test dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start development server and test rendered pages
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/dcg-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          node tests/editorial-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcg-editorial-desktop-mobile
          path: visual-qa/
          retention-days: 14
