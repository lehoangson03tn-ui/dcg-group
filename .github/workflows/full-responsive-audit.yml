name: DCG Full Responsive Grid and Route Audit
on:
  push:
    branches: [responsive-audit-grid-alignment-20261016]
    paths:
      - src/main.js
      - src/design-system.css
      - tests/brand-wide-responsive-audit.mjs
      - .github/workflows/full-responsive-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build and check original approved photo hashes
        run: |
          npm ci
          npm run build
          printf '%s\n' \
            'd849296cc6cbcaee6c592708d728ea8341059bf0151da1395920e0b3c8741e4c  public/assets/recognition/NTTU_0058.jpeg' \
            '400b23d0e4885a851b94250d1112e3a44d9edc4bd4868d3a59a45f58691f5d11  public/assets/recognition/FBA1C8B9-ED38-42D6-8EF9-50CBECBFA44D.jpeg' \
            | sha256sum --check
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Serve original site for before screenshots
        run: |
          git worktree add --detach /tmp/dcg-before 27177fde842835192f0956cd01536b47ad8cb840
          ./node_modules/.bin/vite /tmp/dcg-before --host 127.0.0.1 --port 5174 --strictPort >/tmp/dcg-before.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5174/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/dcg-before.log
          exit 1
      - name: Test all routes, visual baselines, interaction and zoom
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/dcg-after.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          SITE_URL=http://127.0.0.1:5173 BEFORE_URL=http://127.0.0.1:5174 node tests/brand-wide-responsive-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcg-responsive-audit-brand-steps-desktop-tablet-mobile
          path: responsive-audit-proof/
          retention-days: 14
