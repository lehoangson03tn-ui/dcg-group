name: GrowMatch Product Buttons QA
on:
  push:
    branches:
      - fix/growmatch-product-cta-photo-20261030
      - main
    paths:
      - src/growmatch-page.js
      - src/growmatch-page.css
      - tests/growmatch-product-buttons-qa.mjs
      - .github/workflows/growmatch-product-buttons-qa.yml
      - public/assets/guide/growmatch-home-public-20261030.jpg
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buttons-and-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify real screen capture and build
        run: |
          test -s public/assets/guide/growmatch-home-public-20261030.jpg
          npm ci
          npm run build
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Test matching CTAs and screenshot decode on 8 devices
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/dcg-product.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node tests/growmatch-product-buttons-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growmatch-product-button-screenshots
          path: qa-growmatch-product-buttons/
          retention-days: 14
