name: DCG GrowMatch Project-Only Recognition QA
on:
  push:
    branches: [remove-growmatch-home-award-20261016]
    paths:
      - src/main.js
      - src/design-system.css
      - tests/growmatch-project-only-qa.mjs
      - .github/workflows/growmatch-project-only-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build website and verify archival images
        run: |
          npm ci
          npm run build
          printf '%s\n' \
            'd849296cc6cbcaee6c592708d728ea8341059bf0151da1395920e0b3c8741e4c  public/assets/recognition/NTTU_0058.jpeg' \
            '400b23d0e4885a851b94250d1112e3a44d9edc4bd4868d3a59a45f58691f5d11  public/assets/recognition/FBA1C8B9-ED38-42D6-8EF9-50CBECBFA44D.jpeg' | sha256sum -c -
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify six viewports and original project article
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/project-only.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node tests/growmatch-project-only-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcg-growmatch-project-only-desktop-tablet-mobile
          path: qa-growmatch-project-only/
          retention-days: 14
