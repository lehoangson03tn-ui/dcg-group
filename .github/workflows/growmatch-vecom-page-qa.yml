name: GrowMatch Vecom Editorial QA
on:
  push:
    branches:
      - feature/growmatch-vecom-editorial-20261030
      - feature/growmatch-carousel-ai-gallery-20261030
      - fix/growmatch-ipad-hero-media-team-20261030
      - fix/growmatch-product-cta-photo-20261030
      - main
    paths:
      - src/growmatch-page.js
      - src/growmatch-page.css
      - src/main.js
      - tests/growmatch-vecom-page-qa.mjs
      - tests/growmatch-ipad-webkit-qa.mjs
      - .github/workflows/growmatch-vecom-page-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Confirm archive photos unchanged
        run: |
          printf '%s\n' \
            'd849296cc6cbcaee6c592708d728ea8341059bf0151da1395920e0b3c8741e4c  public/assets/recognition/NTTU_0058.jpeg' \
            '400b23d0e4885a851b94250d1112e3a44d9edc4bd4868d3a59a45f58691f5d11  public/assets/recognition/FBA1C8B9-ED38-42D6-8EF9-50CBECBFA44D.jpeg' \
            | sha256sum --check
      - run: npm ci && npm run build
      - run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Test GrowMatch layout and media at 11 breakpoints
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/dcg-growmatch.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node tests/growmatch-vecom-page-qa.mjs
          node tests/growmatch-ipad-webkit-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growmatch-vecom-responsive-evidence
          path: |
            qa-growmatch-vecom/
            qa-growmatch-webkit/
          retention-days: 14
