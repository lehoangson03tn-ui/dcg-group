name: Import approved real editorial photographs
on:
  push:
    branches: [editorial-real-photography-20261015]
    paths:
      - tools/import_editorial_photos.py
      - .github/workflows/import-editorial-photography.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-photo-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Download four verified free photos and preserve their colors
        run: python tools/import_editorial_photos.py
      - name: Save original downloaded JPG and sized WebP derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/editorial/
          git diff --cached --quiet && exit 0
          git commit -m "assets: archive four licensed photographs and optimized responsive formats"
          git pull --rebase origin editorial-real-photography-20261015
          git push origin HEAD:editorial-real-photography-20261015
