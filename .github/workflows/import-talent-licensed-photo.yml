name: Import Licensed Talent Editorial Photo
on:
  push:
    branches: [talent-licensed-photo-no-public-credits-20261016]
    paths:
      - tools/import_talent_licensed_photo.py
      - .github/workflows/import-talent-licensed-photo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/import_talent_licensed_photo.py
      - name: Save original and responsive renditions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/editorial/talent-student-collaboration-*.webp public/assets/editorial/talent-student-collaboration-licensed-source.jpg
          git diff --cached --quiet && exit 0
          git commit -m "assets: archive original licensed student collaboration image"
          git pull --rebase origin talent-licensed-photo-no-public-credits-20261016
          git push origin HEAD:talent-licensed-photo-no-public-credits-20261016
