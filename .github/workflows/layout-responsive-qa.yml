name: DCG Ecosystem Layout Regression
on:
  push:
    branches:
      - fix-ceo-ecosystem-layout-20261015
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build website
        run: |
          npm ci
          npm run build
      - name: Prepare Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Launch prior version for before screenshots
        run: |
          git worktree add --detach /tmp/dcg-before 2c4fd32121d51d567de1b5e617d8d552e9c7ac6a
          ./node_modules/.bin/vite /tmp/dcg-before --host 127.0.0.1 --port 5174 --strictPort >/tmp/dcg-before.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5174/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test rendered layout, zoom and source preservation
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/dcg-after.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          BEFORE_URL=http://127.0.0.1:5174 SITE_URL=http://127.0.0.1:5173 node tests/layout-responsive-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcg-ceo-ecosystem-before-after
          path: layout-qa/
          retention-days: 14
